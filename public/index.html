<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaTeX Editor</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
    <div class="auth-container">
        <h1>Bem-vindo ao LaTeX Editor</h1>
        
        <div id="error-message" style="color: red; margin-bottom: 10px; display: none;"></div>

        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div>
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div>
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" id="login-btn">Entrar</button>
            </form>
            <p>Não tem conta? <a href="#register-section" id="show-register">Registre-se aqui</a></p>
        </div>
        <div id="register-section" style="display: none;">
            <h2>Criar Conta</h2>
            <form id="register-form">
                <div>
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div>
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" required minlength="3" maxlength="30">
                </div>
                <div>
                    <label for="reg-password">Senha (mín. 12 caracteres)</label>
                    <input type="password" id="reg-password" required minlength="12">
                </div>
                <button type="submit" id="register-btn">Criar Conta</button>
            </form>
            <p>Já tem conta? <a href="#login-section" id="show-login">Faça login aqui</a></p>
        </div>
    </div>
    <script type="module">
        import { request } from './js/api.js';

        const loginSection = document.getElementById('login-section');
        const registerSection = document.getElementById('register-section');
        const errorDiv = document.getElementById('error-message');

        document.getElementById('show-register').onclick = (e) => {
            e.preventDefault();
            loginSection.style.display = 'none';
            registerSection.style.display = 'block';
            errorDiv.style.display = 'none';
        };

        document.getElementById('show-login').onclick = (e) => {
            e.preventDefault();
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
            errorDiv.style.display = 'none';
        };

        const showError = (msg) => {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                const data = await request('/auth/login', {
                    method: 'POST',
                    body: { email, password }
                });
                localStorage.setItem('token', data.session.token);
                window.location.href = '/dashboard.html';

            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        };

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const btn = document.getElementById('register-btn');
            btn.disabled = true;
            btn.textContent = 'Criando...';

            try {
                const email = document.getElementById('reg-email').value;
                const username = document.getElementById('reg-username').value;
                const password = document.getElementById('reg-password').value;

                const data = await request('/auth/register', {
                    method: 'POST',
                    body: { email, username, password }
                });
                localStorage.setItem('token', data.session.token);
                window.location.href = '/dashboard.html';

            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.textContent = 'Criar Conta';
            }
        };
    </script>
</body>
</html>
