<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>LaTeX Editor | Dashboard</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
			rel="stylesheet"
		>
		<link rel="stylesheet" href="../style/main.css">
		<script type="module" src="../js/main.js" defer></script>
	</head>
	<body data-page="dashboard">
		<header class="dashboard-header" id="dashboard-header">Header</header>
		<aside class="sidebar" id="dashboard-sidebar">
			<div class="sidebar-section">
				<button type="button">All Projects</button>
			</div>
			<div class="sidebar-section" id="workspaces-section">
				<div class="sidebar-label">Workspaces</div>
				<div id="workspace-list"></div>
			</div>
			<div class="sidebar-section">
				<button type="button">Archived</button>
			</div>
			<div class="sidebar-section">
				<button type="button" onclick="window.location.href = './account.html'">
					Account
				</button>
				<button
					type="button"
					onclick="window.location.href = 'https://github.com/caetanoag/latex-editor'"
				>
					Source Code
				</button>
			</div>
		</aside>

		<section class="projects-list" id="projects-list">
			<p id="dashboard-message" class="hidden"></p>
			<table>
				<thead>
					<tr>
						<th></th>
						<th>Title</th>
						<th>Owner</th>
						<th>Last Modified</th>
					</tr>
				</thead>
				<tbody id="projects-body"></tbody>
			</table>
		</section>
	</body>
</html>
