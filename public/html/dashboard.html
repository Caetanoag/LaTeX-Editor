<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>LaTeX Editor | Dashboard</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
			rel="stylesheet"
		>
		<link rel="stylesheet" href="../style/main.css">
		<script type="module" src="../js/main.js" defer></script>
	</head>
	<body data-page="dashboard">
		<header class="dashboard-header" id="dashboard-header">
			<h1 class="dashboard-title" id="dashboard-title">Header</h1>
			<div
				class="selection-card hidden"
				id="selection-card"
				role="group"
				aria-label="Project selection actions"
			>
				<span class="selection-count" id="selection-count"></span>
				<div class="selection-actions">
					<button type="button" id="edit-project-button">Edit</button>
					<button type="button" id="archive-projects-button">Archive</button>
				</div>
			</div>
			<div
				class="selection-card hidden"
				id="workspace-selection-card"
				role="group"
				aria-label="Selected workspace actions"
			>
				<span class="selection-count" id="workspace-selection-name"></span>
				<div
					id="workspace-selection-tags"
					class="workspace-tags hidden"
					role="group"
					aria-label="Local tags for this workspace, saved only in this browser"
				>
					<span id="workspace-tags-label" class="workspace-tags-label">Local tags (this browser only)</span>
					<div id="workspace-selection-chips" class="tag-chips"></div>
				</div>
				<div class="selection-actions">
					<button type="button" id="edit-workspace-button">Edit</button>
					<button type="button" id="delete-workspace-button">Delete</button>
				</div>
			</div>
		</header>
		<aside class="sidebar" id="dashboard-sidebar">
			<div class="sidebar-section" id="projects-section">
				<div class="sidebar-label">Projects</div>
				<button
					type="button"
					id="create-project-button"
					class="create-button"
				>
					+ Create Project
				</button>
			</div>
			<div class="sidebar-section" id="workspaces-section">
				<div class="sidebar-label">Workspaces</div>
				<div id="workspace-list"></div>
				<button
					type="button"
					id="create-workspace-button"
					class="create-button"
				>
					+ Create Workspace
				</button>
			</div>
			<div class="sidebar-section">
				<button type="button" id="archived-button" aria-pressed="false">
					Archived
				</button>
			</div>
			<div class="sidebar-section">
				<button type="button" onclick="window.location.href = './account.html'">
					Account
				</button>
				<button
					type="button"
					onclick="window.location.href = 'https://github.com/caetanoag/latex-editor'"
				>
					Source Code
				</button>
			</div>
		</aside>

		<section class="projects-list" id="projects-list">
			<table>
				<thead>
					<tr>
						<th id="selection-header"></th>
						<th>Title</th>
						<th>Owner</th>
						<th>Last Modified</th>
						<th id="actions-header">Editor</th>
					</tr>
				</thead>
				<tbody id="projects-body"></tbody>
			</table>
			<p id="dashboard-message" class="hidden" role="status"></p>
		</section>

		<dialog id="workspace-dialog" class="app-dialog">
			<form id="create-workspace-form">
				<h2 id="workspace-dialog-title">Create Workspace</h2>
				<label for="workspace-name">Name</label>
				<input
					type="text"
					id="workspace-name"
					name="name"
					maxlength="100"
					required
				>
				<label for="workspace-description">Description (optional)</label>
				<textarea
					id="workspace-description"
					name="description"
					maxlength="500"
				></textarea>
				<label for="workspace-tags">Tags (this browser only)</label>
				<input
					type="text"
					id="workspace-tags"
					name="tags"
					aria-describedby="workspace-tags-help"
				>
				<p id="workspace-tags-help" class="form-help">Saved only in this browser. They are not shared with other users or devices; anyone using this browser can see them.</p>
				<p
					id="workspace-dialog-error"
					class="form-error hidden"
					role="alert"
				></p>
				<div class="dialog-actions">
					<button type="button" id="cancel-workspace-button">Cancel</button>
					<button type="submit" id="submit-workspace-button">Create</button>
				</div>
			</form>
		</dialog>

		<dialog id="project-dialog" class="app-dialog">
			<form id="create-project-form">
				<h2 id="project-dialog-title">Create Project</h2>
				<label for="project-title">Title</label>
				<input
					type="text"
					id="project-title"
					name="title"
					maxlength="200"
					required
				>
				<label for="project-description">Description (optional)</label>
				<textarea
					id="project-description"
					name="description"
					maxlength="1000"
				></textarea>
				<label for="project-visibility">Visibility</label>
				<select id="project-visibility" name="visibility">
					<option value="private">Private</option>
					<option value="workspace">Workspace</option>
					<option value="public">Public</option>
				</select>
				<p
					id="project-dialog-error"
					class="form-error hidden"
					role="alert"
				></p>
				<div class="dialog-actions">
					<button type="button" id="cancel-project-button">Cancel</button>
					<button type="submit" id="submit-project-button">Create</button>
				</div>
			</form>
		</dialog>
	</body>
</html>
